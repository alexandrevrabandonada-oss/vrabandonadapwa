name: Validar portal e matérias
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'content/materias/**'
      - 'public/data/instagram-posts.json'
      - 'public/instagram-media/**'
      - '.github/workflows/import-instagram.yml'
      - '.github/workflows/audit-publication.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.eslintrc*'
      - 'tests/**'
      - '.github/workflows/validate-portal.yml'
  push:
    paths:
      - 'content/materias/**'
      - 'app/materias/**'
      - 'lib/materias/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Testar formatos e segurança da importação
        run: node --test tests/*.test.mjs
      - name: Instalar dependências
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Compilar e validar matérias
        run: npm run build
      - name: Verificar renderização HTTP local (sem Vercel)
        run: node scripts/smoke-local-portal.mjs
      - name: Instalar Playwright isolado para revisão Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install chromium --with-deps
      - name: Auditar jornadas e capturar telas públicas no Chromium
        run: node scripts/audit-local-ux.mjs
      - name: Auditar acessibilidade WCAG e reflow equivalente a zoom 200/400%
        run: node scripts/audit-accessibility-v7.mjs
      - name: Publicar relatório de acessibilidade
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-abandonada-qa-accessibility
          path: artifacts/qa-v7-accessibility/
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar capturas para revisão de UX
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-abandonada-qa-visual
          path: artifacts/qa-v7-visual/
          if-no-files-found: warn
          retention-days: 7
