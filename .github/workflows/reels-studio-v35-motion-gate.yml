name: Reels Studio V35 — source-native motion integrity gate
on:
  pull_request:
    paths:
      - 'tools/reels-studio/studio/motion_gate_v35.py'
      - 'tools/reels-studio/tests/test_motion_gate_v35.py'
      - '.github/workflows/reels-studio-v35-motion-gate.yml'
      - 'tools/reels-studio/RELATORIO_V35.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reels-studio
    steps:
      - uses: actions/checkout@v4
      - name: Install motion analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject false provenance, fake voice and static visual regression
        run: python -m pytest -q tests/test_motion_gate_v35.py
