name: Reels Studio V39 — adaptive motion by documentary intent
on:
  pull_request:
    paths:
      - 'tools/reels-studio/studio/adaptive_director_v39.py'
      - 'tools/reels-studio/studio/qa_adaptive_v39.py'
      - 'tools/reels-studio/tests/test_adaptive_director_v39.py'
      - 'tools/reels-studio/examples/scorecard_v39.json'
      - '.github/workflows/reels-studio-v39-adaptive-intent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-by-editorial-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: tools/reels-studio
    steps:
      - uses: actions/checkout@v4
      - name: Install historical-film rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato fonts-roboto-unhinted
          python -m pip install -r requirements.txt
      - name: Test story-appropriate animation and authenticity gates
        run: |
          python -m pytest -q tests/test_adaptive_director_v39.py
          python -m studio.adaptive_director_v39 --help >/dev/null
          python -m studio.qa_adaptive_v39 --help >/dev/null
      - name: Acquire original verifiable 1941, 1969 and 2014 CSN photography
        run: |
          set -euo pipefail
          mkdir -p work/v39/sources work/v39/output
          python -m studio.verified_media_v31 --out work/v39/sources > work/v39/output/SOURCES_V39.json
          for x in csn_construction_1941.tif csn_interior_1969.jpg csn_2014_01.jpg; do
            test -s "work/v39/sources/$x"
          done
          curl --fail --location --show-error --silent --retry 3 --retry-delay 4 \
            --user-agent 'VRAbandonadaEditorialResearch/0.39 (internal documented cinema experiment)' \
            'https://upload.wikimedia.org/wikipedia/commons/3/32/Vicart_-_Aci%C3%A9rie.webm' \
            --output work/v39/sources/france_2011.webm
          echo 'c1129cac8654866856c7bec31196206f16eac6c7  work/v39/sources/france_2011.webm' | sha1sum -c -
      - name: Render native 1080x1920 adaptive kinetic documentary
        run: |
          python -m studio.adaptive_director_v39 \
            --photo1941 work/v39/sources/csn_construction_1941.tif \
            --photo1969 work/v39/sources/csn_interior_1969.jpg \
            --photo2014 work/v39/sources/csn_2014_01.jpg \
            --film work/v39/sources/france_2011.webm \
            --words examples/voice_alexandre_words_v24.json \
            --out work/v39/output/V39_DIRECAO_ADAPTATIVA_MASTER.mp4
      - name: Check actual shot movement, loudness and no fictional voice claim
        run: |
          python -m studio.qa_adaptive_v39 \
            --video work/v39/output/V39_DIRECAO_ADAPTATIVA_MASTER.mp4 \
            --words examples/voice_alexandre_words_v24.json \
            --out work/v39/output/V39_QA.json
          python - <<'PY'
          from pathlib import Path
          import json
          b=Path('work/v39/output');q=json.loads((b/'V39_QA.json').read_text());m=json.loads((b/'V39_DIRECAO_ADAPTATIVA_MASTER.json').read_text())
          assert q['qa_technical_ok'] and len(q['shots'])==8
          assert sum(x['motion_profile']=='kinetic' for x in m['shot_plan'])==4
          assert sum(x['motion_profile']=='measured' for x in m['shot_plan'])==4
          assert not m['voice_embedded'] and not m['original_alexandre_bytes_verified']
          assert not m['publication_approved']
          PY
      - name: Preserve a factual, unpublished master and QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v39-adaptive-motion-original-historic-media-internal
          path: |
            tools/reels-studio/work/v39/output/V39_DIRECAO_ADAPTATIVA_MASTER.mp4
            tools/reels-studio/work/v39/output/V39_DIRECAO_ADAPTATIVA_MASTER.json
            tools/reels-studio/work/v39/output/V39_QA.json
            tools/reels-studio/work/v39/output/SOURCES_V39.json
          retention-days: 7
          if-no-files-found: error
