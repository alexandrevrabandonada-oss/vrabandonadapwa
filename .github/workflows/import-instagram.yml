name: Importar publicações do Instagram
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-import-vr-abandonada
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sincronizar postagens públicas
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
        run: node scripts/import-instagram.mjs
      - name: Salvar arquivo, se alterado
        run: |
          git config user.name "vr-abandonada-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/instagram-posts.json
          if test -d public/instagram-media; then git add public/instagram-media/; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar acervo público do Instagram"
            git push
          else
            echo "Sem novas publicações."
          fi
