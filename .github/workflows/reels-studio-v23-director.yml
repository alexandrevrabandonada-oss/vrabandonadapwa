name: Reels Studio V23 — beat-directed cinema A/B
on:
  pull_request:
    paths:
      - 'tools/reels-studio/studio/auto_director_v23.py'
      - 'tools/reels-studio/tests/test_auto_director_v23.py'
      - '.github/workflows/reels-studio-v23-director.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinema-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tools/reels-studio
    steps:
      - uses: actions/checkout@v4
      - name: Install media encoders and cinematic editorial fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fontconfig fonts-lato fonts-roboto-unhinted
          python -m pip install -r requirements.txt
          fc-match "Roboto Condensed:style=Bold"
      - name: Validate beat grid, local footage, truthful titles, audio timing
        run: python -m pytest -q tests/test_auto_director_v23.py
      - name: Fetch a genuine CSN photograph and international steel footage
        run: |
          set -euo pipefail
          mkdir -p work/v23/sources work/v23/output
          python - <<'PY'
          from pathlib import Path
          from studio.volta_redonda_v19 import fetch_asset
          print(fetch_asset('csn_2014',Path('work/v23/sources')))
          PY
          curl --fail --location --show-error --silent --retry 3 --retry-delay 4             --user-agent 'VRAbandonadaEditorialResearch/0.23 (internal demo with original credits)'             'https://upload.wikimedia.org/wikipedia/commons/3/32/Vicart_-_Aci%C3%A9rie.webm'             --output work/v23/sources/france_2011.webm
          echo 'c1129cac8654866856c7bec31196206f16eac6c7  work/v23/sources/france_2011.webm' | sha1sum -c -
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          file=Path('work/v23/sources/france_2011.webm')
          item={'id':'france_2011','sha1':hashlib.sha1(file.read_bytes()).hexdigest(),
                'size_bytes':file.stat().st_size,'date_label':2011,'author':'Damien Vicart',
                'source_url':'https://commons.wikimedia.org/wiki/File:Vicart_-_Aci%C3%A9rie.webm',
                'editorial_role':'international industrial context only',
                'publication_approved':False}
          file.with_suffix('.json').write_text(json.dumps(item,indent=2))
          PY
      - name: Render expressive 14-second cinema edit
        run: |
          python -m studio.auto_director_v23             --photo work/v23/sources/csn_2014.jpg             --video work/v23/sources/france_2011.webm             --output work/v23/output/V23_EXPRESSIVO.mp4 --variant expressive
      - name: Render restrained A/B control with the identical factual sources
        run: |
          python -m studio.auto_director_v23             --photo work/v23/sources/csn_2014.jpg             --video work/v23/sources/france_2011.webm             --output work/v23/output/V23_CONTIDO.mp4 --variant restrained
      - name: Measured loudness, peak, dimensions and black-frame QA
        run: |
          set -o pipefail
          python -m studio.qa_v18 work/v23/output/V23_EXPRESSIVO.mp4 --seconds 14 --width 540 --height 960 --fps 24 | tee work/v23/output/QA_V23_EXPRESSIVO.json
          python -m studio.qa_v18 work/v23/output/V23_CONTIDO.mp4 --seconds 14 --width 540 --height 960 --fps 24 | tee work/v23/output/QA_V23_CONTIDO.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['V23_EXPRESSIVO','V23_CONTIDO']:
              report=json.loads(Path(f'work/v23/output/{name}.json').read_text())
              assert report['narration_added'] is False
              assert report['word_level_sync_verified'] is False
              assert report['story_analysis']['visual_grammars']==7
              assert not report['publication_approved']
          PY
      - name: Upload two internal experiments for creative direction
        uses: actions/upload-artifact@v4
        with:
          name: v23-kinetic-cinema-ab-not-published
          path: |
            tools/reels-studio/work/v23/output/V23_*.mp4
            tools/reels-studio/work/v23/output/V23_*.jpg
            tools/reels-studio/work/v23/output/V23_*.json
            tools/reels-studio/work/v23/output/QA_*.json
          retention-days: 7
          if-no-files-found: error
